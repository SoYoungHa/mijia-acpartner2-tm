name: build-dll

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Build (Release x64)
        run: msbuild MijiaPowerPlugin.sln /p:Configuration=Release /p:Platform=x64 /v:minimal /m
      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: MijiaPower
          path: bin/Release/x64/MijiaPower.dll
          if-no-files-found: error
